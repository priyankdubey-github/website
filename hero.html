<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>AI Workday — Your Thoughts Reimagined</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <style data-purpose="animations">
    @keyframes orbit {
      from {
        transform: rotate(0deg) translateX(var(--orbit-radius)) rotate(0deg);
      }
      to {
        transform: rotate(360deg) translateX(var(--orbit-radius)) rotate(-360deg);
      }
    }

    @keyframes orbit-simple {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbit-simple-reverse {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes ray-travel {
      0% {
        left: 0;
        width: 0;
        opacity: 0;
      }
      15% {
        left: 0;
        width: 30%;
        opacity: 1;
      }
      45% {
        left: 100%;
        width: 0;
        opacity: 0;
      }
      55% {
        left: 100%;
        width: 0;
        opacity: 0;
      }
      80% {
        left: 70%;
        width: 30%;
        opacity: 1;
      }
      100% {
        left: 0;
        width: 0;
        opacity: 0;
      }
    }

    @keyframes fade-in-up {
      0% {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes aurora {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(10%, 10%) scale(1.1);
      }
      66% {
        transform: translate(-5%, 5%) scale(0.9);
      }
    }

    body {
      background: #0a0a0c;
      color: white;
      overflow-x: hidden;
    }

    .animate-fade-in-up {
      animation: fade-in-up 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
    }

    .orbit-item {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -24px;
      margin-left: -24px;
      animation: orbit var(--duration) linear infinite;
    }

    .ray-container {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 1px;
      width: var(--orbit-radius);
      transform-origin: left center;
      pointer-events: none;
    }

    .ray-beam {
      position: absolute;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.8), transparent);
      animation: ray-travel 6s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .aurora-blob {
      filter: blur(100px);
      mix-blend-mode: screen;
      animation: aurora 20s ease-in-out infinite alternate;
    }
  </style>
</head>
